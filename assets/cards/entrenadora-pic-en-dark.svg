<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="PIC18F4550 Trainer — For hands-on lab practice">
  <title>PIC18F4550 Trainer — For hands-on lab practice</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath><pattern id="puntos" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.6" fill="#22C7F5" fill-opacity=".13"/></pattern>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#1E2126" stroke="#2E343C" filter="url(#sombra)"/>
  <g clip-path="url(#recorte)"><rect x="14" y="10" width="592" height="344" fill="url(#puntos)"/><rect x="14" y="10" width="592" height="8" fill="#22C7F5"/><path d="M34 43 V30 H47" fill="none" stroke="#22C7F5" stroke-opacity=".45" stroke-width="1.6"/><path d="M586 43 V30 H573" fill="none" stroke="#22C7F5" stroke-opacity=".45" stroke-width="1.6"/><path d="M34 321 V334 H47" fill="none" stroke="#22C7F5" stroke-opacity=".45" stroke-width="1.6"/><path d="M586 321 V334 H573" fill="none" stroke="#22C7F5" stroke-opacity=".45" stroke-width="1.6"/></g>

  <!-- Placa con la sigla -->
  <polygon points="99.0,66.0 85.5,89.4 58.5,89.4 45.0,66.0 58.5,42.6 85.5,42.6" fill="#22C7F5" fill-opacity=".16" stroke="#22C7F5" stroke-opacity=".55"/>
  <text x="72" y="72" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="14" font-weight="700" fill="#22C7F5"
        text-anchor="middle">PIC</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#F7F8FA">PIC18F4550 Trainer</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#22C7F5">For hands-on lab practice</text>

  <text x="48" y="177.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">Designs and layouts for the trainer board used in the channel's lab</text><text x="48" y="200.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">sessions. Built so a student can assemble it and use it, not just</text><text x="48" y="223.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">look at it.</text>
  <rect x="48.0" y="282" width="91.4" height="27" rx="4" fill="#262A31" stroke="#343A43"/><rect x="48.0" y="282" width="3" height="27" fill="#22C7F5" fill-opacity=".65"/><text x="93.7" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">PIC18F4550</text><rect x="146.4" y="282" width="97.9" height="27" rx="4" fill="#262A31" stroke="#343A43"/><rect x="146.4" y="282" width="3" height="27" fill="#22C7F5" fill-opacity=".65"/><text x="195.4" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">Electronics</text><rect x="251.3" y="282" width="45.6" height="27" rx="4" fill="#262A31" stroke="#343A43"/><rect x="251.3" y="282" width="3" height="27" fill="#22C7F5" fill-opacity=".65"/><text x="274.1" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">PCB</text>
  <rect x="48" y="331" width="10" height="10" fill="#2FD69B"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F7F8FA">In use</text><text x="114.743" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#22C7F5">— the lab sessions, on the channel</text>
</svg>
