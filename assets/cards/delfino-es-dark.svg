<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Delfino — Suéltalo y yo lo acomodo">
  <title>Delfino — Suéltalo y yo lo acomodo</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#1E2126" stroke="#2E343C" filter="url(#sombra)"/>
  <g clip-path="url(#recorte)"><rect x="14" y="10" width="7" height="344" fill="#2FD69B"/></g>

  <!-- Placa con la sigla -->
  <rect x="48" y="42" width="48" height="48" rx="13" fill="#2FD69B" fill-opacity=".16" stroke="#2FD69B" stroke-opacity=".5"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#2FD69B"
        text-anchor="middle">DF</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#F7F8FA">Delfino</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#2FD69B">Suéltalo y yo lo acomodo</text>

  <text x="48" y="177.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">Secretario personal: le cuentas el día en lenguaje natural y él lo</text><text x="48" y="200.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">convierte en tareas, plazos y un solo foco. Trae diario personal y</text><text x="48" y="223.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">suscripción activa.</text>
  <rect x="48.0" y="282" width="143.7" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="119.9" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">Cloudflare Workers</text><rect x="198.7" y="282" width="78.3" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="237.9" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">Supabase</text><rect x="284.0" y="282" width="65.2" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="316.6" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">Stripe</text>
  <circle cx="53" cy="336" r="5" fill="#2FD69B"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F7F8FA">En producción</text><text x="162.2765" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2FD69B">— delfino.app</text>
</svg>
