<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="RobotBuscador — InnoBótica 2026 · InnovaTecNM">
  <title>RobotBuscador — InnoBótica 2026 · InnovaTecNM</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#1E2126" stroke="#2E343C" filter="url(#sombra)"/>
  <!-- Filo de color del proyecto, recortado a la esquina redondeada -->
  <g clip-path="url(#recorte)">
    <rect x="14" y="10" width="7" height="344" fill="#FF7A5C"/>
  </g>

  <!-- Placa con la sigla -->
  <rect x="48" y="42" width="48" height="48" rx="13"
        fill="#FF7A5C" fill-opacity=".16" stroke="#FF7A5C" stroke-opacity=".5"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#FF7A5C"
        text-anchor="middle">RB</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#F7F8FA">RobotBuscador</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#FF7A5C">InnoBótica 2026 · InnovaTecNM</text>

  <text x="48" y="166.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">Robot 100 % autónomo de 14 cm que busca y desaloja 12 conos de un</text><text x="48" y="189.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">tablero de 122×244 cm en cinco minutos. Resuelve primero la</text><text x="48" y="212.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">localización: cambiar de estrategia es cambiar código, no rediseñar</text><text x="48" y="235.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">el robot.</text>
  <rect x="48.0" y="282" width="78.3" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="87.2" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">ESP32-S3</text><rect x="133.3" y="282" width="45.6" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="156.1" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">C++</text><rect x="185.9" y="282" width="137.2" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="254.5" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">Visión artificial</text>
  <circle cx="53" cy="336" r="5" fill="#22C7F5"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F7F8FA">En competencia</text><text x="169.067" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#FF7A5C">— Etapa regional · septiembre 2026</text>
</svg>
