<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Banary Source — Aula y club de robótica">
  <title>Banary Source — Aula y club de robótica</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#1E2126" stroke="#2E343C" filter="url(#sombra)"/>
  <g clip-path="url(#recorte)"><rect x="14" y="10" width="592" height="100" fill="#22C7F5" fill-opacity=".11"/><rect x="14" y="108" width="592" height="2.5" fill="#22C7F5" fill-opacity=".9"/></g>

  <!-- Placa con la sigla -->
  <rect x="48" y="42" width="48" height="48" rx="13" fill="#22C7F5" fill-opacity=".16" stroke="#22C7F5" stroke-opacity=".5"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#22C7F5"
        text-anchor="middle">BS</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#F7F8FA">Banary Source</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#22C7F5">Aula y club de robótica</text>

  <text x="48" y="177.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">Nuestra plataforma. Las materias que impartimos y el club de robótica</text><text x="48" y="200.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">en un solo lugar, con rangos, experiencia y evidencias por alumno. La</text><text x="48" y="223.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#A3AAB3">usan nuestros estudiantes todos los días.</text>
  <rect x="48.0" y="282" width="58.7" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="77.3" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">React</text><rect x="113.7" y="282" width="91.4" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="159.4" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">TypeScript</text><rect x="212.1" y="282" width="91.4" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="257.8" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">PostgreSQL</text><rect x="310.5" y="282" width="65.2" height="27" rx="13.5" fill="#262A31" stroke="#343A43"/><text x="343.1" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#C6CED6" text-anchor="middle">Prisma</text>
  <circle cx="53" cy="336" r="5" fill="#2FD69B"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#F7F8FA">En producción</text><text x="162.2765" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#22C7F5">— banarysource.org</text>
</svg>
