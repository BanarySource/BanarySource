<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Delfino — Just say it, I'll sort it out">
  <title>Delfino — Just say it, I'll sort it out</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#8C99A6" flood-opacity=".28"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#FFFFFF" stroke="#E1E7EC" filter="url(#sombra)"/>
  <!-- Filo de color del proyecto, recortado a la esquina redondeada -->
  <g clip-path="url(#recorte)">
    <rect x="14" y="10" width="7" height="344" fill="#0E7A5A"/>
  </g>

  <!-- Placa con la sigla -->
  <rect x="48" y="42" width="48" height="48" rx="13"
        fill="#0E7A5A" fill-opacity=".12" stroke="#0E7A5A" stroke-opacity=".5"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#0E7A5A"
        text-anchor="middle">DF</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#16181C">Delfino</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#0E7A5A">Just say it, I'll sort it out</text>

  <text x="48" y="177.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">A personal secretary: tell it about your day in plain language and it</text><text x="48" y="200.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">turns that into tasks, deadlines and a single focus. Includes a</text><text x="48" y="223.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">personal journal and an active subscription.</text>
  <rect x="48.0" y="282" width="143.7" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="119.9" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">Cloudflare Workers</text><rect x="198.7" y="282" width="78.3" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="237.9" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">Supabase</text><rect x="284.0" y="282" width="65.2" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="316.6" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">Stripe</text>
  <circle cx="53" cy="336" r="5" fill="#2FD69B"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#16181C">Live</text><text x="101.162" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#0E7A5A">— delfino.app</text>
</svg>
