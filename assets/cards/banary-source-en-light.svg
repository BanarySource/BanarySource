<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Banary Source — Classroom and robotics club">
  <title>Banary Source — Classroom and robotics club</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#8C99A6" flood-opacity=".28"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#FFFFFF" stroke="#E1E7EC" filter="url(#sombra)"/>
  <g clip-path="url(#recorte)"><rect x="14" y="10" width="592" height="100" fill="#0E7FA8" fill-opacity=".08"/><rect x="14" y="108" width="592" height="2.5" fill="#0E7FA8" fill-opacity=".9"/></g>

  <!-- Placa con la sigla -->
  <rect x="48" y="42" width="48" height="48" rx="13" fill="#0E7FA8" fill-opacity=".12" stroke="#0E7FA8" stroke-opacity=".5"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#0E7FA8"
        text-anchor="middle">BS</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#16181C">Banary Source</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#0E7FA8">Classroom and robotics club</text>

  <text x="48" y="177.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">Our own platform. The courses we teach and the robotics club in one</text><text x="48" y="200.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">place, with ranks, experience points and per-student evidence. Our</text><text x="48" y="223.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">students use it every day.</text>
  <rect x="48.0" y="282" width="58.7" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="77.3" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">React</text><rect x="113.7" y="282" width="91.4" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="159.4" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">TypeScript</text><rect x="212.1" y="282" width="91.4" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="257.8" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">PostgreSQL</text><rect x="310.5" y="282" width="65.2" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="343.1" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">Prisma</text>
  <circle cx="53" cy="336" r="5" fill="#0E7A5A"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#16181C">Live</text><text x="101.162" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#0E7FA8">— banarysource.org</text>
</svg>
