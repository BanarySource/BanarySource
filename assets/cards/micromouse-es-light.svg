<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Micromouse RP2040 — Hardware abierto">
  <title>Micromouse RP2040 — Hardware abierto</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#8C99A6" flood-opacity=".28"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath><pattern id="puntos" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.6" fill="#6D3BC4" fill-opacity=".13"/></pattern>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#FFFFFF" stroke="#E1E7EC" filter="url(#sombra)"/>
  <g clip-path="url(#recorte)"><rect x="14" y="10" width="592" height="344" fill="url(#puntos)"/><rect x="14" y="10" width="592" height="8" fill="#6D3BC4"/><path d="M34 43 V30 H47" fill="none" stroke="#6D3BC4" stroke-opacity=".45" stroke-width="1.6"/><path d="M586 43 V30 H573" fill="none" stroke="#6D3BC4" stroke-opacity=".45" stroke-width="1.6"/><path d="M34 321 V334 H47" fill="none" stroke="#6D3BC4" stroke-opacity=".45" stroke-width="1.6"/><path d="M586 321 V334 H573" fill="none" stroke="#6D3BC4" stroke-opacity=".45" stroke-width="1.6"/></g>

  <!-- Placa con la sigla -->
  <polygon points="99.0,66.0 85.5,89.4 58.5,89.4 45.0,66.0 58.5,42.6 85.5,42.6" fill="#6D3BC4" fill-opacity=".12" stroke="#6D3BC4" stroke-opacity=".55"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#6D3BC4"
        text-anchor="middle">MM</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#16181C">Micromouse RP2040</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#6D3BC4">Hardware abierto</text>

  <text x="48" y="177.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">Firmware de prueba para cada periférico del micromouse basado en</text><text x="48" y="200.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">RP2040-Zero. Verifica el hardware pieza por pieza y arranca el</text><text x="48" y="223.5" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">prototipo sin pelearse con todo a la vez.</text>
  <rect x="48.0" y="282" width="65.2" height="27" rx="4" fill="#F2F5F8" stroke="#DFE5EB"/><rect x="48.0" y="282" width="3" height="27" fill="#6D3BC4" fill-opacity=".65"/><text x="80.6" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">RP2040</text><rect x="120.2" y="282" width="45.6" height="27" rx="4" fill="#F2F5F8" stroke="#DFE5EB"/><rect x="120.2" y="282" width="3" height="27" fill="#6D3BC4" fill-opacity=".65"/><text x="143.0" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">C++</text><rect x="172.9" y="282" width="97.9" height="27" rx="4" fill="#F2F5F8" stroke="#DFE5EB"/><rect x="172.9" y="282" width="3" height="27" fill="#6D3BC4" fill-opacity=".65"/><text x="221.8" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">Open source</text>
  <rect x="48" y="331" width="10" height="10" fill="#5A626B"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#16181C">Código abierto</text><text x="169.067" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6D3BC4">— ver el repositorio</text>
</svg>
