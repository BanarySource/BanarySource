<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Print Cost Manager — Lo que de verdad cuesta imprimir">
  <title>Print Cost Manager — Lo que de verdad cuesta imprimir</title>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9"
                    flood-color="#8C99A6" flood-opacity=".28"/>
    </filter>
    <clipPath id="recorte">
      <rect x="14" y="10" width="592" height="344" rx="18"/>
    </clipPath>
  </defs>

  <!-- Panel flotante -->
  <rect x="14" y="10" width="592" height="344" rx="18"
        fill="#FFFFFF" stroke="#E1E7EC" filter="url(#sombra)"/>
  <!-- Filo de color del proyecto, recortado a la esquina redondeada -->
  <g clip-path="url(#recorte)">
    <rect x="14" y="10" width="7" height="344" fill="#FFC24F"/>
  </g>

  <!-- Placa con la sigla -->
  <rect x="48" y="42" width="48" height="48" rx="13"
        fill="#FFC24F" fill-opacity=".12" stroke="#FFC24F" stroke-opacity=".5"/>
  <text x="72" y="73" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#FFC24F"
        text-anchor="middle">PC</text>

  <text x="112" y="65" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25"
        font-weight="700" fill="#16181C">Print Cost Manager</text>
  <text x="112" y="87" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14.5"
        font-weight="600" fill="#FFC24F">Lo que de verdad cuesta imprimir</text>

  <text x="48" y="189.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">Calcula el costo real de una impresión 3D —filamento, energía,</text><text x="48" y="212.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">desgaste y tiempo— en vez de estimarlo a ojo. Gratis y sin registro.</text>
  <rect x="48.0" y="282" width="58.7" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="77.3" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">React</text><rect x="113.7" y="282" width="91.4" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="159.4" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">TypeScript</text><rect x="212.1" y="282" width="52.2" height="27" rx="13.5" fill="#F2F5F8" stroke="#DFE5EB"/><text x="238.2" y="300" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#3A424B" text-anchor="middle">Vite</text>
  <circle cx="53" cy="336" r="5" fill="#2FD69B"/><text x="66" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#16181C">En línea</text><text x="128.324" y="341" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#FFC24F">— printcostmanager.vercel.app</text>
</svg>
