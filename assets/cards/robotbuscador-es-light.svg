  <text x="48" y="166.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">Robot 100 % autónomo de 14 cm que busca y desaloja 12 conos de un</text><text x="48" y="189.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">tablero de 122×244 cm en cinco minutos. Resuelve primero la</text><text x="48" y="212.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">localización: cambiar de estrategia es cambiar código, no rediseñar</text><text x="48" y="235.0" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5A626B">el robot.</text>
