<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 148" width="400" height="148" role="img" aria-label="Instagram — @banarysource">
  <title>Instagram — @banarysource</title>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8"
                    flood-color="#8C99A6" flood-opacity=".28"/>
    </filter>
    <clipPath id="r"><rect x="10" y="6" width="380" height="128" rx="16"/></clipPath>
  </defs>

  <rect x="10" y="6" width="380" height="128" rx="16"
        fill="#FFFFFF" stroke="#E1E7EC" filter="url(#s)"/>
  <g clip-path="url(#r)"><rect x="10" y="6" width="6" height="128" fill="#B81E55"/></g>

  <g transform="translate(36 30) scale(1.4167)"><g fill="none" stroke="#B81E55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="16.9" cy="7.1" r=".9" fill="#B81E55"/>
    </g></g>

  <text x="86" y="47" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23"
        font-weight="700" fill="#16181C">Instagram</text>
  <text x="86" y="70" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16"
        font-weight="600" fill="#B81E55">@banarysource</text>
  <text x="36" y="112" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16"
        fill="#5A626B">El día a día del taller</text>
</svg>
