<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 148" width="620" height="148" role="img" aria-label="Email — contacto@banarysource.org">
  <title>Email — contacto@banarysource.org</title>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="r"><rect x="10" y="6" width="600" height="128" rx="16"/></clipPath>
  </defs>

  <rect x="10" y="6" width="600" height="128" rx="16"
        fill="#1E2126" stroke="#2E343C" filter="url(#s)"/>

  <!-- Disco de color con el icono dentro: el acento de este apartado -->
  <circle cx="58" cy="52" r="25" fill="#FFC24F" fill-opacity=".14"
          stroke="#FFC24F" stroke-opacity=".45"/>
  <g transform="translate(42 36) scale(1.3333)"><g fill="none" stroke="#FFC24F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
      <path d="M3.4 7.2 12 13.4l8.6-6.2"/>
