<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 148" width="400" height="148" role="img" aria-label="Instagram — @banarysource">
  <title>Instagram — @banarysource</title>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="r"><rect x="10" y="6" width="380" height="128" rx="16"/></clipPath>
  </defs>

  <rect x="10" y="6" width="380" height="128" rx="16"
        fill="#1E2126" stroke="#2E343C" filter="url(#s)"/>

  <!-- Disco de color con el icono dentro: el acento de este apartado -->
  <circle cx="58" cy="52" r="25" fill="#E1306C" fill-opacity=".14"
          stroke="#E1306C" stroke-opacity=".45"/>
  <g transform="translate(42 36) scale(1.3333)"><g fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="16.9" cy="7.1" r=".9" fill="#E1306C"/>
    </g></g>

  <text x="98" y="46" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23"
        font-weight="700" fill="#F7F8FA">Instagram</text>
  <path d="M98 56 h34" stroke="#E1306C" stroke-width="3" stroke-linecap="round"/>
  <text x="98" y="78" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16"
        font-weight="600" fill="#E1306C">@banarysource</text>
  <text x="36" y="115" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16"
        fill="#A3AAB3">Knowledge within everyone's reach</text>
</svg>
